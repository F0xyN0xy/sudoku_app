name: sudoku_app
description: A Sudoku app with puzzle generation, PDF export, and solution lookup.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

dependency_overrides:
  archive: ^4.4.0